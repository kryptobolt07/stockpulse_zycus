spring.application.name=stockpulse-backend
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:stockpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Strategy Configuration (RULE_BASED or AI_POWERED)
commerce.strategy.active=AI_POWERED

# LLM Gateway Configuration (Zycus LiteLLM / Gemini)
llm.provider=${LLM_PROVIDER:openai-compatible}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-2.5-flash-payg-uscentral1}
llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net/v1}

# Custom Gateway Headers
llm.custom-headers.product=ta
llm.custom-headers.flowname=djs_campus
llm.custom-headers.bundlename=djs_campus
llm.custom-headers.x-zycus-userid=zycus_djs
llm.custom-headers.x-zycus-tenantid=zycus
llm.custom-headers.x-zycus-execution-mode=manual

# Logging
logging.level.com.stockpulse=INFO
logging.level.org.springframework.web=INFO
